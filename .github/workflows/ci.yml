name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  merge_group:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v5

    - name: Prepare Python
      uses: actions/setup-python@v6
      with:
          python-version: "3.11"

    - name: Install dependencies
      run: pip install pre-commit

    - name: Run pre-commit hooks
      run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
    - name: Check out repository
      uses: actions/checkout@v5

    - name: Prepare Python
      uses: actions/setup-python@v6
      with:
          python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libegl1 libqt6gui6 libxcb-cursor0

    - name: Install PEtabGUI with test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install '.[test]'

    - name: Run tests with pytest
      run: |
        echo "Running pytest on repository tests"
        # Run repository and domain tests (test_upload.py has known failures)
        pytest tests/adapters/ tests/domain/ tests/test_helpers/ \
          -v --cov=petab_gui --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      if: matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  launch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
    - name: Check out repository
      uses: actions/checkout@v5

    - name: Prepare Python
      uses: actions/setup-python@v6
      with:
          python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libegl1 libqt6gui6 libxcb-cursor0

    - name: Install PEtabGUI
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Launch GUI
      # Ensure that we can launch the GUI
      run: |
        echo "Launching Xvfb"
        Xvfb :99 -screen 0 1920x1200x24 &
        export DISPLAY=:99
        echo "Running petab_gui --version"
        petab_gui --version
        echo "Running petab_gui without arguments"
        petab_gui &
        echo $! > petabgui_pid.txt
        sleep 10
        kill $(cat petabgui_pid.txt)
        echo "Running petab_gui with example problem"
        petab_gui example/problem.yaml &
        echo $! > petabgui_pid.txt
        sleep 10
        kill $(cat petabgui_pid.txt)
